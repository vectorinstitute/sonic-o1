<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: transparent;
    padding: 16px;
    color: #000000;
  }
  .control-row {
    display: flex;
    gap: 20px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  .control-group { display: flex; flex-direction: column; gap: 4px; }
  .control-group label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #9a9a9a;
  }
  .pill-row { display: flex; gap: 3px; }
  .pill {
    padding: 6px 14px;
    border: 1px solid #e4e4e0;
    border-radius: 20px;
    background: #ffffff;
    cursor: pointer;
    font-size: 11.5px;
    font-weight: 500;
    color: #3c3c3c;
    transition: all 0.15s;
    user-select: none;
  }
  .pill:hover { background: #f5f5f5; }
  .pill.active {
    background: rgba(235,8,138,0.07);
    color: #EB088A;
    border-color: #EB088A;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    line-height: 1.4;
  }
  thead th {
    background: #f5f5f5;
    color: #000000;
    padding: 9px 10px;
    text-align: center;
    font-weight: 600;
    font-size: 12px;
  }
  thead th:first-child { text-align: left; border-radius: 6px 0 0 0; }
  thead th:last-child { border-radius: 0 6px 0 0; }
  tbody td {
    padding: 8px 10px;
    text-align: center;
    border-bottom: 1px solid #e4e4e0;
    font-variant-numeric: tabular-nums;
  }
  tbody td:first-child {
    text-align: left;
    font-weight: 500;
    font-size: 12.5px;
  }
  tbody tr:hover { background: #f5f5f5; }
  tbody tr:first-child { background: rgba(235,8,138,0.07); }
  tbody tr:first-child:hover { background: rgba(235,8,138,0.1); }
  .cell-best {
    background: #eef8f1;
    font-weight: 700;
    color: #2d6a3f;
    border-radius: 3px;
  }
  .cell-worst {
    background: #fff1f1;
    font-weight: 600;
    color: #9f2f2f;
    border-radius: 3px;
  }
  .gap-col {
    font-weight: 600;
    color: #3c3c3c;
    font-size: 12px;
  }
  .note {
    font-size: 10.5px;
    color: #9a9a9a;
    margin-top: 10px;
    line-height: 1.5;
  }
  #table-container { min-height: 250px; }
  .metric-label {
    font-size: 11px;
    color: #9a9a9a;
    margin-bottom: 8px;
    font-style: italic;
  }
</style>
</head>
<body>

<div class="control-row">
  <div class="control-group">
    <label>Demographic</label>
    <div class="pill-row" id="dim-pills">
      <div class="pill active" data-dim="race">Race</div>
      <div class="pill" data-dim="gender">Gender</div>
      <div class="pill" data-dim="age">Age</div>
    </div>
  </div>
  <div class="control-group">
    <label>Task</label>
    <div class="pill-row" id="task-pills">
      <div class="pill active" data-task="summ">Summarization</div>
      <div class="pill" data-task="mcq">MCQ Accuracy</div>
      <div class="pill" data-task="temporal">Temporal R@0.5</div>
    </div>
  </div>
</div>

<div id="metric-label" class="metric-label"></div>
<div id="table-container"></div>

<p class="note">
  <span style="display:inline-block;width:12px;height:12px;background:#eef8f1;border:1px solid #d7eadc;border-radius:2px;vertical-align:middle;margin-right:3px;"></span> Best &nbsp;
  <span style="display:inline-block;width:12px;height:12px;background:#fff1f1;border:1px solid #f0d0d0;border-radius:2px;vertical-align:middle;margin-right:3px;"></span> Worst &nbsp;
  <b>Gap</b> = best − worst (lower is better). † Closed-source.
  Data from Tables 4–6 of the paper.
</p>

<script>
const models = [
  'Gemini 3.0 Pro †', 'Qwen3-Omni', 'UniMoE-2.0',
  'MiniCPM-o-2.6', 'Baichuan-Omni 1.5', 'OLA',
  'VITA 1.5', 'VideoLLaMA2'
];

const headers = {
  race: ['White', 'Black', 'Asian', 'Hispanic', 'Indigenous', 'Arab'],
  gender: ['Male', 'Female'],
  age: ['18–24', '25–39', '40+'],
};

const metricLabels = {
  summ: 'LLM-judge Score (0–10), higher is better',
  mcq: 'Accuracy (%), higher is better',
  temporal: 'R@0.5 (%), higher is better',
};

// Paper Tables 4, 5, 6: all 3 dimensions × 3 tasks
const data = {
  race: {
    summ: [
      [6.68, 6.02, 7.05, 6.41, 6.70, 6.90],
      [5.28, 4.39, 5.71, 4.99, 4.13, 5.95],
      [4.29, 3.45, 4.62, 3.70, 4.35, 5.00],
      [3.26, 2.92, 3.26, 3.04, 3.61, 3.57],
      [3.22, 2.55, 3.61, 2.44, 3.70, 4.29],
      [4.27, 3.60, 4.29, 3.62, 4.39, 4.76],
      [2.50, 2.31, 2.65, 2.21, 1.65, 2.76],
      [1.45, 1.38, 1.63, 1.23, 1.04, 1.00],
    ],
    mcq: [
      [81.2, 79.2, 80.3, 79.1, 80.0, 82.7],
      [66.5, 63.5, 61.8, 63.5, 68.6, 63.9],
      [51.0, 48.9, 53.6, 48.5, 42.9, 48.7],
      [51.2, 49.5, 51.0, 48.5, 48.6, 50.3],
      [55.8, 52.2, 55.7, 48.2, 62.9, 58.6],
      [52.7, 48.3, 53.4, 46.5, 31.4, 51.3],
      [49.0, 48.1, 49.5, 48.5, 42.4, 47.1],
      [26.7, 24.6, 23.2, 22.6, 8.6, 20.9],
    ],
    temporal: [
      [23.0, 19.5, 30.7, 23.8, 40.9, 21.1],
      [2.6, 1.8, 2.9, 2.3, 0.0, 1.6],
      [1.2, 0.6, 0.6, 0.1, 1.3, 0.2],
      [0.9, 0.3, 0.8, 0.2, 0.0, 2.6],
      [1.3, 0.8, 1.6, 0.8, 5.8, 0.3],
      [1.2, 1.7, 1.3, 1.4, 9.2, 1.4],
      [1.4, 1.4, 1.4, 0.8, 1.3, 1.2],
      [0.5, 0.3, 0.4, 0.0, 1.3, 0.0],
    ],
  },
  gender: {
    summ: [
      [6.36, 7.02],
      [4.97, 5.47],
      [3.93, 4.55],
      [2.98, 3.53],
      [2.94, 3.47],
      [4.00, 4.29],
      [2.31, 2.65],
      [1.36, 1.53],
    ],
    mcq: [
      [81.4, 79.4],
      [65.1, 64.5],
      [51.4, 49.2],
      [49.7, 51.5],
      [55.7, 53.2],
      [51.6, 50.3],
      [49.1, 48.2],
      [25.1, 24.6],
    ],
    temporal: [
      [23.5, 24.2],
      [2.6, 2.1],
      [0.9, 0.7],
      [0.7, 0.9],
      [1.1, 1.4],
      [1.3, 1.5],
      [1.2, 1.4],
      [0.4, 0.4],
    ],
  },
  age: {
    summ: [
      [6.28, 6.52, 6.91],
      [4.93, 5.01, 5.47],
      [4.02, 4.01, 4.45],
      [3.30, 3.14, 3.21],
      [3.04, 3.11, 3.25],
      [4.12, 3.96, 4.29],
      [2.41, 2.45, 2.47],
      [1.38, 1.50, 1.36],
    ],
    mcq: [
      [80.9, 79.5, 81.4],
      [59.5, 63.5, 67.3],
      [49.3, 48.7, 52.4],
      [50.7, 50.2, 50.7],
      [55.4, 51.8, 57.0],
      [46.3, 49.2, 53.7],
      [49.5, 48.6, 48.7],
      [23.8, 25.4, 24.7],
    ],
    temporal: [
      [27.3, 25.2, 21.9],
      [2.4, 2.5, 2.3],
      [1.2, 1.2, 0.4],
      [1.1, 0.7, 0.8],
      [1.8, 1.3, 0.9],
      [2.7, 1.4, 1.2],
      [1.1, 1.2, 1.5],
      [0.3, 0.3, 0.4],
    ],
  },
};

let currentDim = 'race';
let currentTask = 'summ';

function render() {
  const cols = headers[currentDim];
  const rows = data[currentDim][currentTask];
  const container = document.getElementById('table-container');
  document.getElementById('metric-label').textContent = metricLabels[currentTask];

  let html = '<table><thead><tr><th>Model</th>';
  cols.forEach(c => html += '<th>' + c + '</th>');
  html += '<th>Gap ↓</th></tr></thead><tbody>';

  rows.forEach((vals, i) => {
    const maxV = Math.max(...vals);
    const minV = Math.min(...vals);
    const gap = (maxV - minV).toFixed(1);
    html += '<tr><td>' + models[i] + '</td>';
    vals.forEach(v => {
      let cls = '';
      if (v === maxV) cls = ' class="cell-best"';
      else if (v === minV) cls = ' class="cell-worst"';
      html += '<td' + cls + '>' + v.toFixed(1) + '</td>';
    });
    html += '<td class="gap-col">' + gap + '</td></tr>';
  });

  html += '</tbody></table>';
  container.innerHTML = html;
}

// Pill click handlers
document.querySelectorAll('#dim-pills .pill').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('#dim-pills .pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    currentDim = p.dataset.dim;
    render();
  });
});

document.querySelectorAll('#task-pills .pill').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('#task-pills .pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    currentTask = p.dataset.task;
    render();
  });
});

render();
</script>
</body>
</html>
