<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: transparent;
    padding: 16px;
    color: #1e293b;
  }
  .control-row {
    display: flex;
    gap: 20px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  .control-group { display: flex; flex-direction: column; gap: 4px; }
  .control-group label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #8a8a8a;
  }
  .pill-row { display: flex; gap: 3px; }
  .pill {
    padding: 6px 14px;
    border: 1px solid #d4d4d4;
    border-radius: 20px;
    background: #f5f5f5;
    cursor: pointer;
    font-size: 11.5px;
    font-weight: 500;
    color: #6b6b6b;
    transition: all 0.15s;
    user-select: none;
  }
  .pill:hover { background: #ebebeb; }
  .pill.active {
    background: #1a1a1a;
    color: #fff;
    border-color: #1a1a1a;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    line-height: 1.4;
  }
  thead th {
    background: #1a1a1a;
    color: #fff;
    padding: 9px 10px;
    text-align: center;
    font-weight: 600;
    font-size: 12px;
  }
  thead th:first-child { text-align: left; border-radius: 6px 0 0 0; }
  thead th:last-child { border-radius: 0 6px 0 0; }
  tbody td {
    padding: 8px 10px;
    text-align: center;
    border-bottom: 1px solid #ebebeb;
    font-variant-numeric: tabular-nums;
  }
  tbody td:first-child {
    text-align: left;
    font-weight: 500;
    font-size: 12.5px;
  }
  tbody tr:hover { background: #f5f5f5; }
  tbody tr:first-child { background: #fdf2f8; }
  tbody tr:first-child:hover { background: #fce7f3; }
  .cell-best {
    background: #dcfce7;
    font-weight: 700;
    color: #166534;
    border-radius: 3px;
  }
  .cell-worst {
    background: #fee2e2;
    font-weight: 600;
    color: #991b1b;
    border-radius: 3px;
  }
  .gap-col {
    font-weight: 600;
    color: #6b6b6b;
    font-size: 12px;
  }
  .note {
    font-size: 10.5px;
    color: #8a8a8a;
    margin-top: 10px;
    line-height: 1.5;
  }
  #table-container { min-height: 250px; }
  .metric-label {
    font-size: 11px;
    color: #8a8a8a;
    margin-bottom: 8px;
    font-style: italic;
  }
</style>
</head>
<body>

<div class="control-row">
  <div class="control-group">
    <label>Demographic</label>
    <div class="pill-row" id="dim-pills">
      <div class="pill active" data-dim="race">Race</div>
      <div class="pill" data-dim="gender">Gender</div>
      <div class="pill" data-dim="age">Age</div>
    </div>
  </div>
  <div class="control-group">
    <label>Task</label>
    <div class="pill-row" id="task-pills">
      <div class="pill active" data-task="summ">Summarization</div>
      <div class="pill" data-task="mcq">MCQ Accuracy</div>
      <div class="pill" data-task="temporal">Temporal R@0.5</div>
    </div>
  </div>
</div>

<div id="metric-label" class="metric-label"></div>
<div id="table-container"></div>

<p class="note">
  <span style="display:inline-block;width:12px;height:12px;background:#dcfce7;border:1px solid #bbf7d0;border-radius:2px;vertical-align:middle;margin-right:3px;"></span> Best &nbsp;
  <span style="display:inline-block;width:12px;height:12px;background:#fee2e2;border:1px solid #fecaca;border-radius:2px;vertical-align:middle;margin-right:3px;"></span> Worst &nbsp;
  <b>Gap</b> = best − worst (lower is better). † Closed-source.
  Data from Tables 4–6 of the paper.
</p>

<script>
const models = [
  'Gemini 3.0 Pro †', 'Qwen3-Omni', 'UniMoE-2.0',
  'MiniCPM-o-2.6', 'VITA 1.5', 'VideoLLaMA2'
];

const headers = {
  race: ['White', 'Black', 'Asian', 'Hispanic', 'Indigenous', 'Arab'],
  gender: ['Male', 'Female'],
  age: ['18–24', '25–39', '40+'],
};

const metricLabels = {
  summ: 'LLM-judge Score (0–10), higher is better',
  mcq: 'Accuracy (%), higher is better',
  temporal: 'R@0.5 (%), higher is better',
};

// Paper Tables 4, 5, 6 — all 3 dimensions × 3 tasks
const data = {
  race: {
    summ: [
      [6.68, 6.02, 7.05, 6.41, 6.70, 6.90],
      [5.28, 4.39, 5.71, 4.99, 4.13, 5.95],
      [4.29, 3.45, 4.62, 3.70, 4.35, 5.00],
      [3.26, 2.92, 3.26, 3.04, 3.61, 3.57],
      [2.50, 2.31, 2.65, 2.21, 1.65, 2.76],
      [1.45, 1.38, 1.63, 1.23, 1.04, 1.00],
    ],
    mcq: [
      [96.9, 96.4, 97.8, 95.8, 94.3, 98.4],
      [93.3, 92.0, 96.1, 92.8, 77.1, 96.9],
      [89.0, 87.7, 89.2, 86.4, 80.0, 95.3],
      [87.6, 86.9, 88.7, 82.2, 82.9, 92.7],
      [82.3, 82.7, 84.6, 79.9, 62.9, 93.2],
      [55.0, 55.4, 58.1, 51.5, 65.7, 67.0],
    ],
    temporal: [
      [23.0, 19.5, 30.7, 23.8, 40.9, 21.1],
      [2.6, 1.8, 2.9, 2.3, 0.0, 1.6],
      [1.2, 0.6, 0.6, 0.1, 1.3, 0.2],
      [0.9, 0.3, 0.8, 0.2, 0.0, 2.6],
      [1.4, 1.4, 1.4, 0.8, 1.3, 1.2],
      [0.5, 0.3, 0.4, 0.0, 1.3, 0.0],
    ],
  },
  gender: {
    summ: [
      [6.36, 7.02],
      [4.97, 5.47],
      [3.93, 4.55],
      [2.98, 3.53],
      [2.31, 2.65],
      [1.36, 1.53],
    ],
    mcq: [
      [96.3, 97.6],
      [93.5, 93.4],
      [88.4, 89.3],
      [86.5, 88.3],
      [82.2, 83.8],
      [53.0, 60.0],
    ],
    temporal: [
      [23.5, 24.2],
      [2.6, 2.1],
      [0.9, 0.7],
      [0.7, 0.9],
      [1.2, 1.4],
      [0.4, 0.4],
    ],
  },
  age: {
    summ: [
      [6.28, 6.52, 6.91],
      [4.93, 5.01, 5.47],
      [4.02, 4.01, 4.45],
      [3.30, 3.14, 3.21],
      [2.41, 2.45, 2.47],
      [1.38, 1.50, 1.36],
    ],
    mcq: [
      [97.4, 95.6, 98.0],
      [91.5, 92.7, 94.6],
      [83.3, 87.7, 91.0],
      [84.5, 86.8, 88.4],
      [83.0, 81.7, 84.0],
      [54.8, 55.8, 56.3],
    ],
    temporal: [
      [27.3, 25.2, 21.9],
      [2.4, 2.5, 2.3],
      [1.2, 1.2, 0.4],
      [1.1, 0.7, 0.8],
      [1.1, 1.2, 1.5],
      [0.3, 0.3, 0.4],
    ],
  },
};

let currentDim = 'race';
let currentTask = 'summ';

function render() {
  const cols = headers[currentDim];
  const rows = data[currentDim][currentTask];
  const container = document.getElementById('table-container');
  document.getElementById('metric-label').textContent = metricLabels[currentTask];

  let html = '<table><thead><tr><th>Model</th>';
  cols.forEach(c => html += '<th>' + c + '</th>');
  html += '<th>Gap ↓</th></tr></thead><tbody>';

  rows.forEach((vals, i) => {
    const maxV = Math.max(...vals);
    const minV = Math.min(...vals);
    const gap = (maxV - minV).toFixed(1);
    html += '<tr><td>' + models[i] + '</td>';
    vals.forEach(v => {
      let cls = '';
      if (v === maxV) cls = ' class="cell-best"';
      else if (v === minV) cls = ' class="cell-worst"';
      html += '<td' + cls + '>' + v.toFixed(1) + '</td>';
    });
    html += '<td class="gap-col">' + gap + '</td></tr>';
  });

  html += '</tbody></table>';
  container.innerHTML = html;
}

// Pill click handlers
document.querySelectorAll('#dim-pills .pill').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('#dim-pills .pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    currentDim = p.dataset.dim;
    render();
  });
});

document.querySelectorAll('#task-pills .pill').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('#task-pills .pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    currentTask = p.dataset.task;
    render();
  });
});

render();
</script>
</body>
</html>
