<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: transparent;
    padding: 16px;
    color: #000000;
  }
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .control-group label {
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #3c3c3c;
  }
  select {
    padding: 6px 10px;
    border: 1px solid #e4e4e0;
    border-radius: 6px;
    font-size: 12.5px;
    background: #ffffff;
    color: #000000;
    cursor: pointer;
    min-width: 160px;
  }
  select:focus { outline: 2px solid #EB088A; border-color: transparent; }
  .chart-container {
    position: relative;
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
  }
  canvas { width: 100% !important; }
  .model-legend {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .model-legend .item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    color: #3c3c3c;
    cursor: pointer;
    padding: 3px 8px;
    border-radius: 4px;
    transition: background 0.15s;
  }
  .model-legend .item:hover { background: #f5f5f5; }
  .model-legend .item.hidden { opacity: 0.35; text-decoration: line-through; }
  .model-legend .swatch {
    width: 12px;
    height: 12px;
    border-radius: 3px;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<div class="controls">
  <div class="control-group">
    <label>Task</label>
    <select id="task-select" onchange="updateChart()">
      <option value="summ">Summarization (Score)</option>
      <option value="mcq">MCQ (Accuracy %)</option>
      <option value="temporal">Temporal (R@0.5 %)</option>
    </select>
  </div>
</div>

<div class="chart-container">
  <canvas id="radar-canvas" height="420"></canvas>
</div>
<div class="model-legend" id="legend"></div>

<script>
const topics = [
  'Patient-Doctor', 'Job Interviews', 'Parent-Teacher',
  'Customer Svc', 'Courtroom', 'Emergency',
  'Transportation', 'Workplace', 'Housing',
  'Restaurant', 'Mental Health', 'Town Halls', 'Olympics'
];

const models = [
  { name: 'Gemini 3.0 Pro', color: '#EB088A' },
  { name: 'Qwen3-Omni', color: '#3c3c3c' },
  { name: 'UniMoE-2.0', color: '#8b7cf6' },
  { name: 'MiniCPM-o-2.6', color: '#38bdf8' },
  { name: 'Baichuan-Omni 1.5', color: '#34d399' },
  { name: 'OLA', color: '#fbbf24' },
  { name: 'VITA 1.5', color: '#fb923c' },
  { name: 'VideoLLaMA2', color: '#9a9a9a' },
];

const data = {
  summ: [
    [8.12, 8.33, 7.94, 7.67, 6.54, 6.25, 7.43, 7.00, 6.58, 5.91, 8.08, 7.00, 5.04],
    [7.38, 7.14, 6.72, 6.13, 6.00, 5.10, 4.86, 6.08, 4.58, 5.00, 7.23, 4.72, 3.39],
    [6.12, 6.76, 5.72, 4.33, 4.08, 3.90, 3.29, 4.75, 4.38, 4.91, 6.69, 4.33, 1.96],
    [4.94, 4.19, 4.28, 3.20, 3.15, 3.35, 2.21, 3.17, 2.88, 3.13, 4.46, 2.06, 2.43],
    [5.81, 5.38, 4.44, 2.73, 3.31, 3.35, 2.14, 4.75, 2.67, 3.09, 5.23, 2.83, 2.09],
    [5.50, 5.90, 5.22, 2.93, 4.15, 3.85, 3.14, 5.67, 4.33, 3.74, 6.38, 4.28, 2.39],
    [4.44, 3.71, 4.22, 1.73, 1.77, 2.70, 2.00, 2.50, 2.58, 2.26, 3.69, 2.28, 2.09],
    [2.31, 2.19, 2.28, 1.27, 0.85, 1.65, 1.00, 1.17, 1.50, 1.70, 2.08, 0.83, 1.13],
  ],
  mcq: [
    [85.3, 85.0, 80.9, 89.7, 81.7, 74.7, 72.5, 85.1, 74.4, 74.4, 87.7, 82.0, 84.1],
    [75.5, 77.0, 68.3, 64.1, 63.5, 57.5, 54.9, 70.1, 67.4, 57.8, 70.8, 66.1, 60.9],
    [63.7, 60.0, 53.5, 53.8, 51.3, 44.2, 45.1, 55.2, 48.1, 44.4, 55.4, 48.1, 47.8],
    [60.8, 57.0, 50.4, 48.7, 47.8, 54.0, 51.0, 53.7, 55.8, 50.0, 56.9, 49.2, 39.1],
    [69.6, 69.0, 61.3, 56.4, 53.9, 50.6, 45.1, 59.7, 51.9, 45.6, 63.1, 50.8, 53.6],
    [63.7, 55.0, 55.2, 48.7, 53.0, 52.9, 43.1, 61.2, 52.7, 51.1, 66.2, 50.8, 37.7],
    [49.0, 56.0, 50.4, 74.4, 47.8, 42.5, 52.9, 56.7, 49.6, 45.6, 49.2, 46.0, 43.5],
    [34.3, 27.0, 25.7, 30.8, 24.3, 28.7, 23.5, 23.9, 26.4, 26.7, 23.1, 23.8, 24.6],
  ],
  temporal: [
    [18.6, 31.0, 21.0, 31.9, 33.5, 17.8, 22.6, 29.6, 27.6, 26.6, 29.6, 15.9, 24.8],
    [4.5, 5.5, 1.5, 3.4, 2.9, 2.4, 0.0, 3.2, 3.1, 4.3, 2.6, 3.0, 0.0],
    [1.9, 1.2, 1.0, 0.9, 0.6, 0.4, 1.0, 3.3, 0.8, 0.5, 0.7, 0.2, 1.2],
    [0.4, 1.6, 1.5, 0.9, 1.5, 0.0, 0.0, 0.7, 1.3, 0.5, 0.7, 0.5, 0.0],
    [0.5, 1.0, 1.2, 0.9, 1.3, 1.3, 0.0, 0.9, 1.1, 1.1, 0.9, 1.6, 2.1],
    [0.4, 0.8, 0.7, 0.9, 1.2, 1.2, 0.9, 1.9, 2.3, 2.4, 0.7, 0.9, 1.9],
    [3.8, 1.2, 1.3, 0.9, 1.5, 0.0, 0.0, 0.0, 1.6, 0.5, 0.7, 1.3, 2.3],
    [1.1, 0.4, 0.2, 0.0, 0.3, 0.4, 0.0, 1.3, 0.5, 0.0, 0.0, 0.2, 1.1],
  ]
};

let chart = null;
let hiddenModels = new Set();

function getMaxForTask(task) {
  if (task === 'summ') return 10;
  if (task === 'mcq') return 100;
  return 50;
}

function updateChart() {
  const task = document.getElementById('task-select').value;
  const datasets = models.map((m, i) => ({
    label: m.name,
    data: data[task][i],
    borderColor: m.color,
    backgroundColor: m.color + '18',
    borderWidth: hiddenModels.has(i) ? 0 : 2,
    pointRadius: hiddenModels.has(i) ? 0 : 3,
    pointBackgroundColor: m.color,
    hidden: hiddenModels.has(i),
    tension: 0.1,
  }));

  if (chart) chart.destroy();

  chart = new Chart(document.getElementById('radar-canvas'), {
    type: 'radar',
    data: { labels: topics, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      scales: {
        r: {
          beginAtZero: true,
          max: getMaxForTask(task),
          ticks: { stepSize: task === 'temporal' ? 10 : undefined, font: { size: 10 }, backdropColor: 'transparent' },
          pointLabels: { font: { size: 10.5, weight: '500' }, color: '#3c3c3c' },
          grid: { color: '#e4e4e0' },
          angleLines: { color: '#e4e4e0' },
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#3c3c3c',
          titleFont: { size: 12 },
          bodyFont: { size: 11.5 },
          padding: 10,
          cornerRadius: 6,
        }
      },
      animation: { duration: 400 },
    }
  });

  renderLegend();
}

function renderLegend() {
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  models.forEach((m, i) => {
    const item = document.createElement('div');
    item.className = 'item' + (hiddenModels.has(i) ? ' hidden' : '');
    item.innerHTML = '<span class="swatch" style="background:' + m.color + '"></span>' + m.name;
    item.onclick = () => {
      if (hiddenModels.has(i)) hiddenModels.delete(i);
      else hiddenModels.add(i);
      updateChart();
    };
    legend.appendChild(item);
  });
}

updateChart();
</script>
</body>
</html>
