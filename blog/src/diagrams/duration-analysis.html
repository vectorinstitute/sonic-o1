<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: transparent;
    padding: 16px;
    color: #000000;
  }
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .control-group label {
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #3c3c3c;
  }
  select {
    padding: 6px 10px;
    border: 1px solid #e4e4e0;
    border-radius: 6px;
    font-size: 12.5px;
    background: #ffffff;
    color: #000000;
    cursor: pointer;
    min-width: 160px;
  }
  .chart-container {
    position: relative;
    width: 100%;
    max-width: 750px;
    margin: 0 auto;
  }
  .insight-box {
    margin-top: 14px;
    padding: 10px 14px;
    background: rgba(235,8,138,0.07);
    border-left: 3px solid #EB088A;
    border-radius: 0 6px 6px 0;
    font-size: 12px;
    color: #000000;
    line-height: 1.55;
  }
  .insight-box strong { color: #EB088A; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<div class="controls">
  <div class="control-group">
    <label>Task</label>
    <select id="task-select" onchange="updateChart()">
      <option value="summ">Summarization (Score)</option>
      <option value="mcq">MCQ (Accuracy %)</option>
      <option value="temporal">Temporal (R@0.5 %)</option>
    </select>
  </div>
</div>

<div class="chart-container">
  <canvas id="bar-canvas" height="300"></canvas>
</div>
<div class="insight-box" id="insight"></div>

<script>
const durations = ['Short (<5 min)', 'Medium (5–20 min)', 'Long (20–60 min)'];

const models = [
  { name: 'Gemini 3.0 Pro', color: '#EB088A' },
  { name: 'Qwen3-Omni', color: '#3c3c3c' },
  { name: 'UniMoE-2.0', color: '#8b7cf6' },
  { name: 'MiniCPM-o-2.6', color: '#38bdf8' },
  { name: 'Baichuan-Omni 1.5', color: '#34d399' },
  { name: 'OLA', color: '#fbbf24' },
  { name: 'VITA 1.5', color: '#fb923c' },
  { name: 'VideoLLaMA2', color: '#9a9a9a' },
];

const data = {
  summ: [
    [8.16, 6.11, 6.63],
    [6.64, 4.95, 4.87],
    [5.49, 4.37, 3.87],
    [4.08, 2.87, 2.87],
    [4.70, 3.06, 2.94],
    [4.63, 4.23, 4.23],
    [3.39, 2.40, 2.46],
    [1.89, 1.46, 1.27],
  ],
  mcq: [
    [81.9, 82.8, 79.5],
    [64.9, 67.1, 65.8],
    [55.3, 50.2, 50.9],
    [59.6, 50.9, 51.9],
    [59.6, 55.3, 56.3],
    [52.1, 54.1, 53.6],
    [53.1, 50.3, 47.8],
    [34.0, 26.3, 25.4],
  ],
  temporal: [
    [50.6, 26.0, 18.6],
    [9.2, 2.6, 2.5],
    [6.9, 0.3, 0.6],
    [0.9, 1.1, 0.6],
    [1.9, 1.4, 1.1],
    [2.9, 1.6, 0.8],
    [3.0, 1.2, 1.0],
    [0.9, 0.3, 0.4],
  ]
};

const insights = {
  summ: '<strong>Summarization degrades with length.</strong> Gemini drops from 8.16 (short) to 6.63 (long). Smaller models like VideoLLaMA2 drop more steeply, from 1.89 to 1.27.',
  mcq: '<strong>MCQ is relatively stable across durations.</strong> Gemini remains strongest across all length bins, while Qwen3-Omni is the top open-source model and changes only modestly from short to long videos.',
  temporal: '<strong>Temporal localization is hit hardest by duration.</strong> Gemini drops from 50.6% (short) to 18.6% (long), a 32-point decline. Open-source models remain in the low single digits across duration bins.',
};

let chart = null;

function updateChart() {
  const task = document.getElementById('task-select').value;
  if (chart) chart.destroy();

  const datasets = models.map((m, i) => ({
    label: m.name,
    data: data[task][i],
    backgroundColor: m.color + 'cc',
    borderColor: m.color,
    borderWidth: 1,
    borderRadius: 4,
  }));

  chart = new Chart(document.getElementById('bar-canvas'), {
    type: 'bar',
    data: { labels: durations, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      scales: {
        y: {
          beginAtZero: true,
          title: {
            display: true,
            text: task === 'summ' ? 'Score (0–10)' : task === 'mcq' ? 'Accuracy (%)' : 'R@0.5 (%)',
            font: { size: 12, weight: '500' },
            color: '#3c3c3c',
          },
          ticks: { font: { size: 11 } },
          grid: { color: '#e4e4e0' },
        },
        x: {
          ticks: { font: { size: 11.5, weight: '500' } },
          grid: { display: false },
        }
      },
      plugins: {
        legend: {
          position: 'bottom',
          labels: { font: { size: 11 }, boxWidth: 12, boxHeight: 12, padding: 12 }
        },
        tooltip: {
          backgroundColor: '#3c3c3c',
          titleFont: { size: 12 },
          bodyFont: { size: 11.5 },
          padding: 10,
          cornerRadius: 6,
        }
      },
      animation: { duration: 400 },
    }
  });

  document.getElementById('insight').innerHTML = insights[task];
}

updateChart();
</script>
</body>
</html>
