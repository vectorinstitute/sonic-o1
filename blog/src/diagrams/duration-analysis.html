<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: transparent;
    padding: 16px;
    color: #1e293b;
  }
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .control-group label {
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #64748b;
  }
  select {
    padding: 6px 10px;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    font-size: 12.5px;
    background: #f8fafc;
    color: #1e293b;
    cursor: pointer;
    min-width: 160px;
  }
  .chart-container {
    position: relative;
    width: 100%;
    max-width: 750px;
    margin: 0 auto;
  }
  .insight-box {
    margin-top: 14px;
    padding: 10px 14px;
    background: #fdf2f8;
    border-left: 3px solid #E10098;
    border-radius: 0 6px 6px 0;
    font-size: 12px;
    color: #1a1a1a;
    line-height: 1.55;
  }
  .insight-box strong { color: #E10098; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<div class="controls">
  <div class="control-group">
    <label>Task</label>
    <select id="task-select" onchange="updateChart()">
      <option value="summ">Summarization (Score)</option>
      <option value="mcq">MCQ (Accuracy %)</option>
      <option value="temporal">Temporal (R@0.5 %)</option>
    </select>
  </div>
</div>

<div class="chart-container">
  <canvas id="bar-canvas" height="300"></canvas>
</div>
<div class="insight-box" id="insight"></div>

<script>
const durations = ['Short (<5 min)', 'Medium (5–20 min)', 'Long (20–60 min)'];

const models = [
  { name: 'Gemini 3.0 Pro', color: '#E10098' },
  { name: 'Qwen3-Omni', color: '#1a1a1a' },
  { name: 'UniMoE-2.0', color: '#7c3aed' },
  { name: 'MiniCPM-o-2.6', color: '#0891b2' },
  { name: 'VITA 1.5', color: '#c2410c' },
  { name: 'VideoLLaMA2', color: '#a3a3a3' },
];

const data = {
  summ: [
    [8.16, 6.11, 6.63],
    [6.64, 4.95, 4.87],
    [5.49, 4.37, 3.87],
    [4.08, 2.87, 2.87],
    [3.39, 2.40, 2.46],
    [1.89, 1.46, 1.27],
  ],
  mcq: [
    [98.9, 95.1, 96.9],
    [91.5, 93.6, 94.5],
    [89.4, 86.5, 90.9],
    [92.6, 84.8, 89.2],
    [85.1, 78.4, 82.4],
    [61.7, 55.5, 52.7],
  ],
  temporal: [
    [50.6, 26.0, 18.6],
    [9.2, 2.6, 2.5],
    [6.9, 0.3, 0.6],
    [0.9, 1.1, 0.6],
    [3.0, 1.2, 1.0],
    [0.9, 0.3, 0.4],
  ]
};

const insights = {
  summ: '<strong>Summarization degrades with length.</strong> Gemini drops from 8.16 (short) to 6.63 (long). Smaller models like VideoLLaMA2 drop more steeply, from 1.89 to 1.27.',
  mcq: '<strong>MCQ is relatively stable across durations.</strong> Qwen3-Omni actually improves slightly on longer videos (91.5% → 94.5%), suggesting that more context can help MCQ reasoning.',
  temporal: '<strong>Temporal localization is hit hardest by duration.</strong> Gemini drops from 50.6% (short) to 18.6% (long) — a 32-point decline. Open-source models collapse below 3% for all durations.',
};

let chart = null;

function updateChart() {
  const task = document.getElementById('task-select').value;
  if (chart) chart.destroy();

  const datasets = models.map((m, i) => ({
    label: m.name,
    data: data[task][i],
    backgroundColor: m.color + 'cc',
    borderColor: m.color,
    borderWidth: 1,
    borderRadius: 4,
  }));

  chart = new Chart(document.getElementById('bar-canvas'), {
    type: 'bar',
    data: { labels: durations, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      scales: {
        y: {
          beginAtZero: true,
          title: {
            display: true,
            text: task === 'summ' ? 'Score (0–10)' : task === 'mcq' ? 'Accuracy (%)' : 'R@0.5 (%)',
            font: { size: 12, weight: '500' },
            color: '#64748b',
          },
          ticks: { font: { size: 11 } },
          grid: { color: '#f1f5f9' },
        },
        x: {
          ticks: { font: { size: 11.5, weight: '500' } },
          grid: { display: false },
        }
      },
      plugins: {
        legend: {
          position: 'bottom',
          labels: { font: { size: 11 }, boxWidth: 12, boxHeight: 12, padding: 12 }
        },
        tooltip: {
          backgroundColor: '#1e293b',
          titleFont: { size: 12 },
          bodyFont: { size: 11.5 },
          padding: 10,
          cornerRadius: 6,
        }
      },
      animation: { duration: 400 },
    }
  });

  document.getElementById('insight').innerHTML = insights[task];
}

updateChart();
</script>
</body>
</html>
